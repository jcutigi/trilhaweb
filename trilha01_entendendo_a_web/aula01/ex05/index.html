<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Criando uma API</title>
</head>

<body>
    <h1>Minha aplicação Web</h1>

    <p id="mensagem">Clique para carregar os dados.</p>

    <button id="botao">Carregar pessoa</button>

    <script>
        const botao = document.querySelector("#botao");
        const mensagem = document.querySelector("#mensagem");

        botao.addEventListener("click", function () {

            fetch("http://localhost:3000/api/pessoa")
                .then(function (resposta) {
                    return resposta.json();
                })
                .then(function (dados) {
                    mensagem.textContent =
                        dados.nome + " é " +
                        dados.profissao + " e trabalha com " +
                        dados.linguagem + ".";
                });

        });
    </script>
</body>

</html>
