<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professores</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Sistema de Cadastro de Professores</h1>
        <p>Gerencie os professores cadastrados.</p>
    </header>

    <main>
        <section>
            <h2>Cadastro de professor</h2>

            <form id="form-professor">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="area">Área:</label>
                <input type="text" id="area" name="area" required>

                <button type="submit" id="botao-salvar">Cadastrar</button>
                <button type="button" id="botao-cancelar" hidden>Cancelar edição</button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section>
            <h2>Professores cadastrados</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Área</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
    
                    <tbody id="tabela-professores">
                        <!-- Os professores serão inseridos aqui pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
